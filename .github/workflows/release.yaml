name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re-)run the release for, e.g. v0.1.0"
        required: true
        type: string

jobs:
  release:
    uses: sweetrpg/github-actions/.github/workflows/python-release.yaml@master
    with:
      tag: ${{ inputs.tag }}
      # Defaults (pip install -r requirements/tests.txt -e . / python -m pytest tests) already
      # match this repo's still-setup.py-based packaging - no override needed.
      publish-to-pypi: true
    secrets: inherit
